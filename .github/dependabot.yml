version: 2

# Todas las PRs de Dependabot van contra develop, agrupadas y una vez por semana
# para no inundar el tablero.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(backend)
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(frontend)
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infra/terraform
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(terraform)

  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(docker)
    # Solo parches de Python 3.12 (3.12.x). Cambiar de versión de Python (3.13, 3.15…)
    # se decide en equipo y se hace a mano, porque también hay que cambiar la CI
    # (que ejecuta los tests con 3.12) y probarlo. Ver la PR #12.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
